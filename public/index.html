<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarajaPay STK Bot</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { .row-3 { grid-template-columns: 1fr; } }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.92rem;
    }
    textarea { min-height: 150px; resize: vertical; font-family: monospace; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 0.5rem 0 0.25rem;
      font-size: 0.82rem;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    .count-pill {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      color: #e2e8f0;
      font-family: monospace;
    }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #startBtn { background: #10b981; color: #052e16; }
    #startBtn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    #stopBtn { background: #ef4444; color: #fff; }
    #stopBtn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status-bar {
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 8px;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .logs {
      margin-top: 1rem;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.75rem;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .log-item { padding: 0.3rem 0; border-bottom: 1px solid #0f172a; word-break: break-word; }
    .ok { color: #34d399; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DarajaPay STK Bot</h1>
    <p class="sub">Paste numbers or upload a <code>.csv</code>/<code>.txt</code> file. Requests are sent <strong>3 seconds apart</strong>.</p>

    <div class="row-3">
      <div>
        <label for="amount">Amount (KES)</label>
        <input id="amount" type="number" min="1" value="100" required />
      </div>
      <div>
        <label for="till">Till Number</label>
        <input id="till" type="text" placeholder="e.g. 123456" required />
      </div>
      <div>
        <label for="batchSize">Batch Size</label>
        <select id="batchSize">
          <option value="all">All at once</option>
          <option value="500" selected>First 500 numbers</option>
          <option value="1000">First 1,000 numbers</option>
          <option value="2500">First 2,500 numbers</option>
        </select>
      </div>
    </div>

    <div>
      <label for="numbers">Phone Numbers (one per line, comma, or space separated)</label>
      <textarea id="numbers" placeholder="254712345678&#10;0798765432&#10;254112233445"></textarea>
      <div class="file-row">
        <input id="csvFile" type="file" accept=".csv,.txt" style="max-width: 280px; padding: 0.35rem;" />
        <span class="count-pill" id="parsedCount">Unique entries: 0</span>
      </div>
    </div>

    <div class="actions">
      <button id="startBtn" onclick="startBot()">Start Sending</button>
      <button id="stopBtn" onclick="stopBot()" disabled>Stop</button>
    </div>

    <div class="status-bar">
      <span id="stateText">Status: Idle</span>
      <span id="progressText">0 / 0 (OK: 0, Err: 0)</span>
    </div>

    <div class="logs" id="logs">
      <div style="color:#64748b;">Showing latest 100 logs...</div>
    </div>
  </div>

  <script>
    let pollTimer = null;
    let countTimer = null;

    function extractUniqueTokens(text) {
      const seen = new Set();
      const result = [];
      const matches = text.match(/[\d+][\d\s\-]{6,15}/g) || [];
      for (const m of matches) {
        const cleaned = m.replace(/[\s\-+]/g, "");
        if (cleaned && !seen.has(cleaned)) {
          seen.add(cleaned);
          result.push(cleaned);
        }
      }
      return result;
    }

    function updateParsedCount() {
      const raw = document.getElementById("numbers").value;
      const count = extractUniqueTokens(raw).length;
      document.getElementById("parsedCount").textContent = `Unique entries: ${count.toLocaleString()}`;
    }

    document.getElementById("numbers").addEventListener("input", () => {
      if (countTimer) clearTimeout(countTimer);
      countTimer = setTimeout(updateParsedCount, 200);
    });

    document.getElementById("csvFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const textarea = document.getElementById("numbers");
      textarea.value = textarea.value.trim() ? `${textarea.value.trim()}\n${text}` : text;
      updateParsedCount();
    });

    async function startBot() {
      const amount = document.getElementById("amount").value.trim();
      const tillNumber = document.getElementById("till").value.trim();
      const batchSizeVal = document.getElementById("batchSize").value;
      const rawNumbers = document.getElementById("numbers").value;

      let numbers = extractUniqueTokens(rawNumbers);
      if (batchSizeVal !== "all") {
        numbers = numbers.slice(0, Number(batchSizeVal));
      }

      if (numbers.length === 0) {
        alert("Please enter or upload at least one phone number.");
        return;
      }

      document.getElementById("startBtn").disabled = true;
      document.getElementById("stateText").textContent = `Status: Queuing ${numbers.length} numbers...`;

      const res = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ numbers, amount, tillNumber })
      });

      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Failed to start batch.");
        document.getElementById("startBtn").disabled = false;
        return;
      }

      startPolling();
    }

    async function stopBot() {
      await fetch("/api/stop", { method: "POST" });
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      fetchStatus();
      pollTimer = setInterval(fetchStatus, 1000);
    }

    async function fetchStatus() {
      const res = await fetch("/api/status");
      const data = await res.json();

      document.getElementById("startBtn").disabled = data.running;
      document.getElementById("stopBtn").disabled = !data.running;

      const remaining = Math.max(0, (data.total || 0) - (data.completed || 0));
      const estMinutes = Math.ceil((remaining * 3) / 60);

      document.getElementById("stateText").textContent = data.running
        ? `Status: Running (~${estMinutes} min left)`
        : "Status: Idle";

      document.getElementById("progressText").textContent =
        `${data.completed || 0} / ${data.total || 0} (OK: ${data.okCount || 0}, Err: ${data.errCount || 0})`;

      const logsDiv = document.getElementById("logs");
      if (Array.isArray(data.recentLogs) && data.recentLogs.length > 0) {
        logsDiv.innerHTML = data.recentLogs
          .map(l => {
            const cls = String(l.status).startsWith("OK") ? "ok" : "err";
            return `<div class="log-item">[${l.time}] <strong>${l.phone}</strong> — <span class="${cls}">${l.status}</span>: ${escapeHtml(l.detail)}</div>`;
          })
          .join("");
        logsDiv.scrollTop = logsDiv.scrollHeight;
      }

      if (!data.running && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    fetchStatus();
  </script>
</body>
</html>
